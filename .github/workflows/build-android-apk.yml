name: Compilar Kamaui Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 21 para Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Capacitor y preparar carpeta www
        run: |
          npm install
          npm run prepare:www
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          for dir in android/app/src/main/res/mipmap-*; do
            cp -f assets/logo-kamaui.jpg "$dir/ic_launcher.png" || true
            cp -f assets/logo-kamaui.jpg "$dir/ic_launcher_round.png" || true
            cp -f assets/logo-kamaui.jpg "$dir/ic_launcher_foreground.png" || true
          done
          for dir in android/app/src/main/res/drawable*; do
            cp -f assets/logo-kamaui.jpg "$dir/splash.png" || true
          done

      - name: Compilar APK Debug instalable
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir Kamaui-Validador-360.apk como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: Kamaui-Validador-360-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
